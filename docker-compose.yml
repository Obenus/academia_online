services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miacademia-app
    # Plesk habla con 127.0.0.1:8080. Publicar el puerto con Docker (iptables/DNAT)
    # se rompe en este VPS aunque la app esté viva. La app escucha en el host.
    network_mode: host
    environment:
      ACADEMIA_HOST_NETWORK: "1"
      PORT: "8080"
      GUNICORN_BIND: "127.0.0.1:8080"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/miacademia}
      ACADEMY_NAME: ${ACADEMY_NAME:-Marca Atractora}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      N8N_WEBHOOK_PREGUNTAS: ${N8N_WEBHOOK_PREGUNTAS:-}
      RECORDING_WEBHOOK_SECRET: ${RECORDING_WEBHOOK_SECRET:-}
      DEFAULT_BILLING_REGION: ${DEFAULT_BILLING_REGION:-es}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      SECRET_KEY_FILE: /run/secrets/secret_key
      MAIL_USERNAME_FILE: /run/secrets/mail_username
      MAIL_PASSWORD_FILE: /run/secrets/mail_password
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
    volumes:
      - ./secrets:/run/secrets:ro
      - ./backups:/app/backups
      - ./templates:/app/templates:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',
          timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 1g
  smtp-relay:
    build:
      context: .
      dockerfile: Dockerfile.smtp-relay
    container_name: miacademia-smtp-relay
    network_mode: host
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m
  billing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miacademia-billing
    command: ["python", "billing_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/miacademia}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      ACADEMY_NAME: ${ACADEMY_NAME:-Marca Atractora}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SKIP_DB_INIT: "1"
      SECRET_KEY_FILE: /run/secrets/secret_key
      MAIL_USERNAME_FILE: /run/secrets/mail_username
      MAIL_PASSWORD_FILE: /run/secrets/mail_password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 768m
  reminder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miacademia-reminder
    command: ["python", "reminder_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/miacademia}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      ACADEMY_NAME: ${ACADEMY_NAME:-Marca Atractora}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SKIP_DB_INIT: "1"
      SECRET_KEY_FILE: /run/secrets/secret_key
      MAIL_USERNAME_FILE: /run/secrets/mail_username
      MAIL_PASSWORD_FILE: /run/secrets/mail_password
      REMINDER_INTERVAL_SEC: ${REMINDER_INTERVAL_SEC:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 768m
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miacademia-backup
    command: ["python", "backup_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/miacademia}
      SKIP_DB_INIT: "1"
      SECRET_KEY_FILE: /run/secrets/secret_key
    volumes:
      - ./secrets:/run/secrets:ro
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1536m
  db:
    image: postgres:16-alpine
    container_name: miacademia-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: miacademia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miacademia"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 1g
volumes:
  postgres_data:
