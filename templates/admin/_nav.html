{# Navegación lateral del panel admin — incluir con: {% include 'admin/_nav.html' %} #}
{% set ep = request.endpoint or '' %}

<style>
  .admin-shell { display:grid; gap:1.25rem; position:relative; }
  @media (min-width:1024px) {
    .admin-shell { grid-template-columns:240px minmax(0,1fr); align-items:start; }
  }
  .admin-nav {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:0.75rem;
    position:sticky;
    top:4.25rem;
  }
  .admin-nav-group { margin-bottom:0.5rem; }
  .admin-nav-group:last-child { margin-bottom:0; }
  .admin-nav-label {
    font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text4); padding:0.35rem 0.65rem 0.25rem;
  }
  .admin-nav-link {
    display:flex; align-items:center; gap:0.5rem;
    padding:0.5rem 0.65rem; border-radius:8px;
    font-size:13px; font-weight:500; color:var(--text2);
    text-decoration:none; transition:background .12s, color .12s;
  }
  .admin-nav-link:hover { background:var(--hover-bg); color:var(--text1); }
  .admin-nav-link.active {
    background:color-mix(in srgb, var(--brand-primary, #7c3aed) 12%, transparent);
    color:var(--brand-primary, #7c3aed); font-weight:600;
  }
  .admin-nav-badge {
    margin-left:auto; font-size:10px; font-weight:700;
    background:#ef4444; color:#fff; padding:1px 6px; border-radius:999px;
  }
  .admin-page-head { margin-bottom:1.25rem; }
  .admin-page-head h1 { font-size:1.35rem; font-weight:700; color:var(--text1); }
  .admin-page-head p { font-size:0.8125rem; color:var(--text4); margin-top:0.25rem; }
  .admin-nav-toggle {
    display:none;
    width:100%;
    align-items:center;
    justify-content:space-between;
    gap:0.5rem;
    padding:0.7rem 0.9rem;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text1);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:0.85rem;
  }
  .admin-nav-backdrop {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,15,20,.35);
    z-index:40;
  }
  @media (max-width:1023px) {
    .admin-nav-toggle { display:flex; }
    .admin-nav-backdrop.is-open { display:block; }
    .admin-nav {
      display:none;
      position:absolute;
      top:3.1rem;
      left:0;
      right:0;
      z-index:45;
      max-height:min(70vh, 28rem);
      overflow-y:auto;
      box-shadow:0 16px 40px rgba(0,0,0,.18);
    }
    .admin-nav.is-open { display:block; }
  }
  @media (min-width:1024px) {
    .admin-nav-toggle, .admin-nav-backdrop { display:none !important; }
  }
</style>

<div class="admin-shell">
  <button type="button" class="admin-nav-toggle" id="admin-nav-toggle" aria-expanded="false" aria-controls="admin-nav-panel">
    <span>⚙️ Menú admin</span>
    <span id="admin-nav-chev">▾</span>
  </button>
  <div class="admin-nav-backdrop" id="admin-nav-backdrop"></div>
  <aside class="admin-nav" id="admin-nav-panel">
    {% include 'admin/_links.html' %}
  </aside>
  <script>
  (function () {
    var btn = document.getElementById('admin-nav-toggle');
    var panel = document.getElementById('admin-nav-panel');
    var back = document.getElementById('admin-nav-backdrop');
    var chev = document.getElementById('admin-nav-chev');
    if (!btn || !panel) return;
    function closeNav() {
      panel.classList.remove('is-open');
      if (back) back.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
      if (chev) chev.textContent = '▾';
    }
    function toggleNav() {
      var open = !panel.classList.contains('is-open');
      panel.classList.toggle('is-open', open);
      if (back) back.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (chev) chev.textContent = open ? '▴' : '▾';
    }
    btn.addEventListener('click', toggleNav);
    if (back) back.addEventListener('click', closeNav);
  })();
  </script>

  <div class="admin-main min-w-0">
